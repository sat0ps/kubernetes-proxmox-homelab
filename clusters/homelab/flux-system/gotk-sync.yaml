apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: homelab
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/sat0ps/kubernetes-proxmox-homelab.git
  ref:
    branch: main
  timeout: 60s
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homelab
  namespace: flux-system
spec:
  interval: 1m
  path: ./clusters/homelab
  prune: true
  wait: true
  timeout: 2m
  sourceRef:
    kind: GitRepository
    name: homelab
