apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: gitops-demo
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/part-of: homelab-gitops
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nginx
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
