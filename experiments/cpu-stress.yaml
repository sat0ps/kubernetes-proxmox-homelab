apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-stress
  namespace: default
spec:
  replicas: 8
  selector:
    matchLabels:
      app: cpu-stress
  template:
    metadata:
      labels:
        app: cpu-stress
    spec:
      containers:
        - name: cpu-stress
          image: busybox:1.36.1
          command: ["/bin/sh", "-c"]
          args:
            - "while true; do :; done"
          resources:
            requests:
              cpu: "500m"
              memory: "32Mi"
            limits:
              cpu: "1"
              memory: "64Mi"
