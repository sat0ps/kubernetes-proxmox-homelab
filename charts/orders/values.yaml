nameOverride: ""
fullnameOverride: ""

frontend:
  replicaCount: 2
  image:
    repository: ghcr.io/sat0ps/orders-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

api:
  replicaCount: 2
  image:
    repository: ghcr.io/sat0ps/orders-api
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  database:
    secretName: orders-database
    secretKey: database-url
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

serviceAccount:
  create: true
  automount: false
  name: ""

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: orders.example.local
  path: /
  pathType: Prefix
  tls: []

networkPolicy:
  enabled: true
  ingressNamespaceSelector: {}
  database:
    enabled: false
    namespaceSelector: {}
    podSelector:
      matchLabels:
        app.kubernetes.io/name: postgresql
    port: 5432

topologySpreadConstraints:
  enabled: true
