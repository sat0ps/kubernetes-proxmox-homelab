name: Orders container build

on:
  pull_request:
    paths:
      - "orders-app/**"
      - ".github/workflows/orders-container-build.yml"
  push:
    branches: [main]
    paths:
      - "orders-app/**"
      - ".github/workflows/orders-container-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t orders-api:ci orders-app/api

      - name: Build frontend image
        run: docker build -t orders-frontend:ci orders-app/frontend

      - name: Start application
        working-directory: orders-app
        run: docker compose up --build -d --wait

      - name: Validate application
        run: |
          set -euo pipefail
          curl --fail --retry 5 --retry-delay 2 http://localhost:8080/healthz
          curl --fail --retry 5 --retry-delay 2 http://localhost:8080/api/healthz
          curl --fail http://localhost:8080/api/readyz
          curl --fail -X POST http://localhost:8080/api/orders             -H 'Content-Type: application/json'             -d '{"customer":"CI","item":"Widget","quantity":2}'
          curl --fail http://localhost:8080/api/orders | grep '"customer":"CI"'
          curl --fail http://localhost:8080/api/metrics | grep orders_api_requests_total

      - name: Show container logs on failure
        if: failure()
        working-directory: orders-app
        run: docker compose logs

      - name: Stop application
        if: always()
        working-directory: orders-app
        run: docker compose down -v
