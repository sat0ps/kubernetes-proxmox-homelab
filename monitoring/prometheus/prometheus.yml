global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: opnsense
    metrics_path: /metrics
    static_configs:
      - targets:
          - 192.168.1.1:9100

  - job_name: kubernetes-nodes
    static_configs:
      - targets:
          - 192.168.1.139:9100
          - 192.168.1.192:9100
          - 192.168.1.134:9100

  - job_name: kubernetes-state
    static_configs:
      - targets:
          - 192.168.1.192:30080
